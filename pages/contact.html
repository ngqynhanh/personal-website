<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../css/contact.css" />
    <link rel="stylesheet" href="../css/navigation.css" />
    <script src="../assets/include-nav.js" defer></script>
</head>
<body>
    <div id="site-nav" data-nav-src="navigation.html"></div>

    <main class="contact-page">
        <header class="contact-header" role="banner">
            <h1 class="contact-title">Contact Me</h1>
        </header>

        <div class="contact-main" role="main">
            <section class="card" aria-label="Contact form">
                <form class="contact-form" action="/api/contact" method="post" accept-charset="UTF-8">

                    <div class="field">
                        <label for="name">Your name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required />
                    </div>

                    <div class="field">
                        <label for="email">Your email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required />
                    </div>

                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button class="send-button" type="submit">
                        <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"></path>
                        </svg>
                        <span>Send Message</span>
                    </button>

                    <p class="form-status" aria-live="polite"></p>
                </form>
            </section>

            <section class="card location-card" aria-label="Location">
                <div class="location-row">
                    <svg class="location-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <!-- <path d="M12 2c-3.86 0-7 3.14-7 7 0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z" fill="currentColor"></path> -->
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"></path>
                    </svg>
                    <div class="location-text">
                        <div class="location-title">Email</div>
                        <a class="location-subtitle contact-email" href="mailto:nguyenanh.mywork@gmail.com">nguyenanh.mywork@gmail.com</a>
                    </div>
                </div>
                <div class="location-row">
                    <svg class="location-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-phone-fill" viewBox="0 0 16 16">
                        <path d="M3 2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm6 11a1 1 0 1 0-2 0 1 1 0 0 0 2 0"/>
                    </svg>
                    <div class="location-text">
                        <div class="location-title">Phone</div>
                        <div class="location-subtitle">+84 393805598</div>
                    </div>
                </div>
                <div class="location-row">
                    <svg class="location-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
                          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                    </svg>
                    <div class="location-text">
                        <div class="location-title">Github</div>
                        <a href="https://github.com/ngqynhanh" class="location-subtitle" target="_blank" rel="noopener noreferrer">https://github.com/ngqynhanh</a>
                    </div>
                </div>
                <div class="location-row">
                    <svg class="location-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
                          <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"/>
                    </svg>
                    <div class="location-text">
                        <div class="location-title">LinkedIn</div>
                        <a href="https://linkedin.com/in/ngqynhanh" class="location-subtitle" target="_blank" rel="noopener noreferrer">https://linkedin.com/in/ngqynhanh</a>
                    </div>
                </div>
                
            </section>
        </div>
    </main>

    <script>
        const contactForm = document.querySelector('.contact-form');
        const formStatus = document.querySelector('.form-status');

        contactForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formStatus.className = 'form-status';
            formStatus.textContent = 'Sending your message...';

            const formData = new FormData(contactForm);
            const payload = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Accept: 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(result.error || 'Unable to send message');
                }

                contactForm.reset();
                formStatus.classList.add('form-status--success');
                formStatus.textContent = result.message || 'Thanks. Your message has been sent to my email inbox.';
            } catch (error) {
                formStatus.classList.add('form-status--error');
                formStatus.textContent = error.message || 'Something went wrong while sending your message.';
            }
        });
    </script>
</body>
</html>
